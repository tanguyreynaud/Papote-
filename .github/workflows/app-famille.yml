# App famille (web/) testée de bout en bout dans un vrai navigateur (Chromium sans écran), sur les émulateurs
# Firebase avec les fonctions de main : installation, proches, envois, agenda, appels, réglages, abonnement,
# hors ligne. Gratuit, rien en ligne. Mode d'emploi : tests/app-famille/README.md.
name: App famille

# Une seule fois par changement : au push (les résultats s'affichent aussi sur la PR). Avant, push + pull_request
# faisaient tourner tout deux fois et doublaient les e-mails d'échec (Tanguy, 3/11).
on:
  push:
    paths: ['web/**', 'firestore.rules', 'storage-eu.rules', 'tests/app-famille/**', 'tests/reseau.test.mjs', '.github/workflows/app-famille.yml']
  workflow_dispatch:

# Un nouveau push sur la même branche de travail annule l'exécution encore en cours du commit précédent (CI plus
# rapide, moins d'attente). Jamais sur main ni sur l'admin (claude/project-thread-dlattc) : le bouton « Publier »
# (outils/publier/ci-verte.sh) y exige une CI verte sur le commit publié, chaque commit y garde donc la sienne.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-dlattc') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/project-thread-dlattc' }}

jobs:
  app-famille:
    # Deux navigateurs : Chromium (Chrome d'Android) et WebKit (Safari d'iPhone, tailles iPhone 15 et iPhone SE). Ce qui ne peut pas
    # tourner sous WebKit est listé, avec sa raison, dans tests/app-famille/WEBKIT.md.
    name: app-famille (${{ matrix.moteur }}${{ matrix.appareil && format(', {0}', matrix.appareil) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - moteur: chromium
          - moteur: webkit
            appareil: iPhone 15
          - moteur: webkit
            appareil: iPhone SE (3rd gen)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAPOTE_MOTEUR: ${{ matrix.moteur }}
      PAPOTE_APPAREIL: ${{ matrix.appareil }}
      # La fin de la console de chaque téléphone dans le compte rendu de WebKit (pour comprendre un échec sans les captures).
      PAPOTE_JOURNAL: ${{ matrix.moteur == 'webkit' && '1' || '' }}
    defaults:
      run:
        working-directory: tests/app-famille
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/app-famille/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-14
      # Tests sans navigateur ni émulateur : réseau mobile de l'admin (opérateur par fréquence, « Vu » sur l'alerte).
      - run: node --test ../reseau.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.moteur }}
      - run: npm test
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-app-famille-${{ matrix.moteur }}${{ matrix.appareil && format('-{0}', matrix.appareil) || '' }}
          path: tests/app-famille/captures/
          if-no-files-found: ignore

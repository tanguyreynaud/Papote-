# App famille (web/) testée de bout en bout dans un vrai navigateur (Chromium sans écran), sur les émulateurs
# Firebase avec les fonctions de main : installation, proches, envois, agenda, appels, réglages, abonnement,
# hors ligne. Gratuit, rien en ligne. Mode d'emploi : tests/app-famille/README.md.
name: App famille

# Une seule fois par changement : au push (les résultats s'affichent aussi sur la PR). Avant, push + pull_request
# faisaient tourner tout deux fois et doublaient les e-mails d'échec (Tanguy, 3/11).
on:
  # Tanguy 19/11 : la file GitHub n'a que 20 places. Au push, seulement l'admin et les lots ; une branche de travail
  # se vérifie avec outils/verifier-avant-pousser.sh, et au besoin à la main (Run workflow sur sa branche).
  push:
    branches: [claude/project-thread-dlattc, 'claude/lot-*']
    paths: ['web/**', 'firestore.rules', 'storage-eu.rules', 'tests/app-famille/**', 'tests/reseau.test.mjs', '.github/workflows/app-famille.yml']
  workflow_dispatch:

# Un nouveau push sur la même branche de travail annule l'exécution encore en cours du commit précédent (CI plus
# rapide, moins d'attente). Jamais sur main ni sur l'admin (claude/project-thread-dlattc) : le bouton « Publier »
# (outils/publier/ci-verte.sh) y exige une CI verte sur le commit publié, chaque commit y garde donc la sienne.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-dlattc') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/project-thread-dlattc' }}

# Tests à l'heure de Paris, comme l'app montrée en France : « aujourd'hui », minuit, jour du mois… (Tanguy, 18/11).
# Les machines de GitHub sont en UTC : sans ça, entre 23 h et minuit (22 h l'été) la date des tests n'était pas celle de Paris.
env:
  TZ: Europe/Paris

jobs:
  app-famille:
    # Deux navigateurs : Chromium (Chrome d'Android) et WebKit (Safari d'iPhone, tailles iPhone 15 et iPhone SE). Ce qui ne peut pas
    # tourner sous WebKit est listé, avec sa raison, dans tests/app-famille/WEBKIT.md.
    # Chaque navigateur passe tous les scénarios, coupés en 3 morceaux parallèles (tests/app-famille/morceaux.js) : chaque
    # scénario tourne exactement une fois par navigateur, chaque morceau avec ses propres émulateurs. D'un bloc, la suite
    # prenait 26 à 30 min par navigateur (jusqu'à 50 en WebKit) ; en morceaux, ~10 min (Tanguy, 19/11 : CI sous 30 min).
    name: app-famille (${{ matrix.appareil && format('webkit, {0}', matrix.appareil) || 'chromium' }}, morceau ${{ matrix.morceau }}/3)
    strategy:
      fail-fast: false
      matrix:
        # Appareil vide = Chromium ; sinon WebKit avec cet iPhone.
        appareil: ['', 'iPhone 15', 'iPhone SE (3rd gen)']
        # Doit aller de 1 au nombre de morceaux de morceaux.js (vérifié ci-dessous, sinon la tâche est rouge).
        morceau: [1, 2, 3]
    runs-on: ubuntu-latest
    # ~10 à 12 min attendues par morceau (installation comprise) : le double, pas plus.
    timeout-minutes: 25
    # Image officielle de Playwright 1.63.0 (même version que le package.json) : navigateurs et paquets système
    # déjà dedans. L'apt des runners (110 ko/s le 18/11) prenait jusqu'à 21 min et faisait couper des jobs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PAPOTE_MOTEUR: ${{ matrix.appareil && 'webkit' || 'chromium' }}
      PAPOTE_APPAREIL: ${{ matrix.appareil }}
      # La fin de la console de chaque téléphone dans le compte rendu de WebKit (pour comprendre un échec sans les captures).
      PAPOTE_JOURNAL: ${{ matrix.appareil && '1' || '' }}
    defaults:
      run:
        working-directory: tests/app-famille
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Conteneur : le dossier appartient au runner, git (preparer.js, git archive) le refuserait sans ceci.
      - run: git config --global --add safe.directory '*'
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/app-famille/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-14
      # Tests sans navigateur ni émulateur : réseau mobile de l'admin (opérateur par fréquence, « Vu » sur l'alerte).
      - run: node --test ../reseau.test.mjs
      - run: npm ci
      # Déjà dans l'image (rien n'est téléchargé). Sous WebKit, la tablette simulée reste dans Chromium, comme la
      # WebView de la vraie tablette Android (banc.js) : les deux moteurs sont donc nécessaires.
      - run: npx playwright install ${{ env.PAPOTE_MOTEUR == 'webkit' && 'webkit chromium' || 'chromium' }}
      # Aucun scénario oublié ni lancé deux fois, et autant de tâches que de morceaux.
      - name: Chaque scénario dans exactement un morceau
        env:
          MORCEAUX_CI: 3
        run: |
          node morceaux.js verifier
          n=$(node morceaux.js nombre)
          if [ "$n" != "$MORCEAUX_CI" ]; then
            echo "::error::morceaux.js a $n morceaux, la matrice de app-famille.yml en lance $MORCEAUX_CI : les mettre d'accord."
            exit 1
          fi
      - name: Scénarios du morceau ${{ matrix.morceau }}/3
        run: node morceaux.js lancer ${{ matrix.morceau }}
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-app-famille-${{ env.PAPOTE_MOTEUR }}${{ matrix.appareil && format('-{0}', matrix.appareil) || '' }}-${{ matrix.morceau }}
          path: tests/app-famille/captures/
          if-no-files-found: ignore

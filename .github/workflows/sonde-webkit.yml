# TEMPORAIRE (branche claude/app-famille-webkit) : sonde du WebKit de Playwright, à retirer.
name: Sonde WebKit
on:
  push:
    branches: [claude/app-famille-webkit]
    paths: ['tests/app-famille/scenarios/zz-sonde-webkit.test.js', '.github/workflows/sonde-webkit.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: tests/app-famille } }
    env: { PAPOTE_MOTEUR: webkit }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests/app-famille/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node preparer.js
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore,auth,storage --project demo-papote --config firebase.json "node --test --test-reporter=spec scenarios/zz-sonde-webkit.test.js"

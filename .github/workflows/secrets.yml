# Recherche de secrets (clés, mots de passe) à chaque push et pull request, sur tout l'historique reçu.
# Gratuit (dépôt public). Échoue si un secret est trouvé : rien ne se fusionne en rouge.
# Faux positifs connus (clé web Firebase publique, clé de site reCAPTCHA, faux sk_test de simulation) : .gitleaks.toml.
name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

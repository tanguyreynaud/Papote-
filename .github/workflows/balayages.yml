# Balayages de la galerie (outils/galerie, sur main) sur l'app famille et l'admin de cette branche, à chaque
# changement de web/ : double toucher, appui long, aucun bouton sans effet visible, bon identifiant envoyé au
# serveur, gestes humains (paysage, zoom, texte agrandi, sombre, noms longs, bouton retour), accessibilité
# (WCAG, texte et cibles trop petits), et la galerie elle-même (erreurs de page, clavier ouvert, largeur).
# Chaque balayage échoue (code 1) dès qu'un souci est trouvé : rien ne se fusionne en rouge.
# Gratuit (dépôt public), rien ne part en ligne. Rapports dans l'artefact « balayages ».
name: Balayages app famille et admin

# Une seule fois par changement : au push (les résultats s'affichent aussi sur la PR). Avant, push + pull_request
# faisaient tourner tout deux fois et doublaient les e-mails d'échec (Tanguy, 3/11).
on:
  push:
    paths: ['web/**', '.github/workflows/balayages.yml']
  workflow_dispatch:

# Un nouveau push sur la même branche de travail annule l'exécution encore en cours du commit précédent (CI plus
# rapide, moins d'attente). Jamais sur main ni sur l'admin (claude/project-thread-dlattc) : le bouton « Publier »
# (outils/publier/ci-verte.sh) y exige une CI verte sur le commit publié, chaque commit y garde donc la sienne.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-dlattc') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/project-thread-dlattc' }}

# Tests à l'heure de Paris, comme l'app montrée en France : « aujourd'hui », minuit, jour du mois… (Tanguy, 18/11).
# Les machines de GitHub sont en UTC : sans ça, entre 23 h et minuit (22 h l'été) la date des tests n'était pas celle de Paris.
env:
  TZ: Europe/Paris

jobs:
  balayage:
    # Ubuntu 24.04 fixé : ubuntu-latest est passé en 26.04 le 06/11 et Playwright 1.56.1 (outils/galerie)
    # n'y installe pas Chromium (« Playwright does not support chromium on ubuntu26.04-x64 »).
    runs-on: ubuntu-24.04
    # Les gestes de l'app famille (172 écrans × 6 variantes) prenaient environ 50 min dans une seule tâche, et
    # faisaient toute la durée de la CI : ils sont coupés en 3 tâches parallèles de 2 variantes chacune (~17 min).
    # Tâche la plus longue : ~17 min (gestes, 2 variantes). Limite au double environ.
    timeout-minutes: 35
    # Image officielle de Playwright 1.56.1 (même version que le package.json) : navigateurs et paquets système
    # déjà dedans. L'apt des runners (110 ko/s le 18/11) prenait jusqu'à 21 min et faisait couper des jobs.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      # Les tâches les plus longues d'abord : avec plus de 20 tâches à la fois (limite de GitHub), les dernières
      # attendent une place ; ce sont alors les plus courtes (19/11 : les gestes, partis 10 min en retard, faisaient
      # toute la durée de la CI).
      matrix:
        include:
          # Gestes : chaque variante (gestes.js, VARIANTES) tourne dans exactement une des 3 tâches (GESTES_VARIANTES),
          # ~17 min chacune. Vérifié par l'étape « Chaque variante de gestes dans exactement une tâche ».
          - mode: '--gestes famille'
            variantes: 'normal,paysage'
          - mode: '--gestes famille'
            variantes: 'zoom 130 %,texte +30 %'
          - mode: '--gestes famille'
            variantes: 'mode sombre,noms très longs'
          - mode: '--accessibilite famille admin'
          # Identifiants : l'admin et l'app famille dans deux tâches parallèles (~10 et ~14 min) au lieu d'une de 23 min
          # (19/11) ; chacune passe une fois, comme avant (« --identifiants admin famille » = admin puis famille).
          - mode: '--identifiants famille'
          - mode: '--boutons famille admin'
          - mode: '--appui famille admin'
          - mode: '--double famille admin'
          - mode: '--identifiants admin'
          # App et admin dans WebKit (moteur de Safari) en iPhone SE et iPhone 15 : simulé, pas un vrai iPhone.
          - mode: '--iphone famille admin'
          - mode: 'famille admin'
    defaults:
      run:
        working-directory: outil/outils/galerie
    steps:
      - uses: actions/checkout@v4
      # L'outil vit sur main ; les écrans testés sont ceux de cette branche (web/ copié à côté de l'outil).
      - uses: actions/checkout@v4
        with:
          ref: main
          path: outil
          sparse-checkout: outils/galerie
      - run: rm -rf outil/web && cp -r web outil/web
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pas de package-lock.json dans outils/ (.gitignore) : npm install, pas npm ci.
      - run: npm install --no-audit --no-fund
      # Déjà dans l'image (rien n'est téléchargé) ; ne servirait que si la version du package changeait sans l'image.
      - run: npx playwright install chromium ${{ contains(matrix.mode, '--iphone') && 'webkit' || '' }}
      # Les 3 tâches de gestes réunies = toutes les variantes de gestes.js, chacune une fois ; et cette tâche en est une.
      # Une variante ajoutée dans gestes.js (main) sans être ajoutée ici rend la CI rouge au lieu d'être oubliée.
      - name: Chaque variante de gestes dans exactement une tâche
        if: matrix.variantes
        env:
          GESTES_VARIANTES: ${{ matrix.variantes }}
          TACHES: 'normal,paysage|zoom 130 %,texte +30 %|mode sombre,noms très longs'
        run: |
          node -e '
            const toutes = require("./gestes").VARIANTES.map((v) => v.nom).sort();
            const taches = process.env.TACHES.split("|");
            const vues = taches.flatMap((t) => t.split(",")).sort();
            if (JSON.stringify(vues) !== JSON.stringify(toutes)) {
              console.error(`::error::Variantes des tâches de gestes (${vues.join(" ; ")}) différentes de gestes.js (${toutes.join(" ; ")}) : balayages.yml à mettre à jour.`);
              process.exit(1);
            }
            if (!taches.includes(process.env.GESTES_VARIANTES)) {
              console.error(`::error::Tâche de gestes « ${process.env.GESTES_VARIANTES} » absente de TACHES.`);
              process.exit(1);
            }
            console.log(`${toutes.length} variantes, chacune dans une des ${taches.length} tâches de gestes.`);
          '
      - name: Balayage ${{ matrix.mode }} ${{ matrix.variantes }}
        env:
          GESTES_VARIANTES: ${{ matrix.variantes }}
        run: node galerie.js ${{ matrix.mode }} --famille=ici --admin=ici
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balayages-${{ strategy.job-index }}
          path: |
            outil/outils/galerie/sortie/*.txt
            outil/outils/galerie/sortie/galerie.html
          if-no-files-found: ignore

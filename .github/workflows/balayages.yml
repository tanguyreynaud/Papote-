# Balayages de la galerie (outils/galerie) sur le site vitrine et les e-mails, à chaque changement de vitrine/
# ou du générateur d'e-mails : double toucher, appui long, gestes humains (paysage, zoom, texte agrandi, sombre),
# accessibilité (WCAG, texte et cibles trop petits), e-mails dans les vraies boîtes (Gmail sans styles, Outlook approché,
# mode sombre, images bloquées : captures dans courriels.html), et la galerie elle-même
# (erreurs de page, clavier ouvert, largeur). Chaque balayage échoue (code 1) dès qu'un souci est trouvé :
# rien ne se fusionne en rouge. Gratuit (dépôt public), rien ne part en ligne. Rapports dans l'artefact « balayages ».
name: Balayages site et e-mails

# Une seule fois par changement : au push (les résultats s'affichent aussi sur la PR). Avant, push + pull_request
# faisaient tourner tout deux fois et doublaient les e-mails d'échec (Tanguy, 3/11).
on:
  push:
    paths: ['vitrine/**', 'functions/mail.js', 'functions/mail/**', 'outils/galerie/**', '.github/workflows/balayages.yml']
  workflow_dispatch:

# Un nouveau push sur la même branche de travail annule l'exécution encore en cours du commit précédent (CI plus
# rapide, moins d'attente). Jamais sur main ni sur l'admin (claude/project-thread-dlattc) : le bouton « Publier »
# (outils/publier/ci-verte.sh) y exige une CI verte sur le commit publié, chaque commit y garde donc la sienne.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-dlattc') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/project-thread-dlattc' }}

jobs:
  balayage:
    # Ubuntu 24.04 fixé : ubuntu-latest est passé en 26.04 le 06/11 et Playwright 1.56.1 (outils/galerie)
    # n'y installe pas Chromium (« Playwright does not support chromium on ubuntu26.04-x64 »).
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # 30 + le 1er remplissage du cache Playwright (apt jusqu’à 20 min, 18/11)
    strategy:
      fail-fast: false
      matrix:
        mode:
          - '--double vitrine'
          - '--appui vitrine'
          - '--gestes vitrine'
          - '--accessibilite vitrine'
          - '--courriels'
          - 'vitrine emails'
          # Site dans WebKit (moteur de Safari) en iPhone SE et iPhone 15 : simulé, pas un vrai iPhone.
          - '--iphone vitrine'
    defaults:
      run:
        working-directory: outils/galerie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pas de package-lock.json dans outils/ (.gitignore) : npm install, pas npm ci.
      - run: npm install --no-audit --no-fund
      # Navigateur chromium de Playwright en cache (navigateurs et paquets système .deb) : l'installation complète
      # prenait jusqu'à 21 min (paquets apt à 110 ko/s, 18/11) et faisait couper la tâche. Cache trouvé : seulement
      # les dépendances système (install-deps), avec les .deb déjà là. Version de Playwright + navigateur + image.
      - name: Version de Playwright (chromium)
        id: pw
        run: echo "cle=playwright-$(node -p "require('playwright/package.json').version")-chromium-$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: pw-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pw.outputs.cle }}
      - name: Installer chromium (Playwright)
        run: |
          if [ -d ~/.cache/apt-playwright ]; then sudo cp ~/.cache/apt-playwright/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
          mkdir -p ~/.cache/apt-playwright && cp /var/cache/apt/archives/*.deb ~/.cache/apt-playwright/ 2>/dev/null || true
      # Gardé dès l'installation finie, même si les tests échouent ensuite (le cache d'un job rouge n'était pas gardé).
      - uses: actions/cache/save@v4
        if: steps.pw-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pw.outputs.cle }}
      # Navigateur webkit de Playwright en cache (navigateurs et paquets système .deb) : l'installation complète
      # prenait jusqu'à 21 min (paquets apt à 110 ko/s, 18/11) et faisait couper la tâche. Cache trouvé : seulement
      # les dépendances système (install-deps), avec les .deb déjà là. Version de Playwright + navigateur + image.
      - name: Version de Playwright (webkit)
        id: pwwk
        if: contains(matrix.mode, '--iphone')
        run: echo "cle=playwright-$(node -p "require('playwright/package.json').version")-webkit-$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: pwwk-cache
        if: contains(matrix.mode, '--iphone')
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pwwk.outputs.cle }}
      - name: Installer webkit (Playwright)
        if: contains(matrix.mode, '--iphone')
        run: |
          if [ -d ~/.cache/apt-playwright ]; then sudo cp ~/.cache/apt-playwright/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          if [ "${{ steps.pwwk-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps webkit; else npx playwright install --with-deps webkit; fi
          mkdir -p ~/.cache/apt-playwright && cp /var/cache/apt/archives/*.deb ~/.cache/apt-playwright/ 2>/dev/null || true
      # Gardé dès l'installation finie, même si les tests échouent ensuite (le cache d'un job rouge n'était pas gardé).
      - uses: actions/cache/save@v4
        if: contains(matrix.mode, '--iphone') && steps.pwwk-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pwwk.outputs.cle }}
      - name: Balayage ${{ matrix.mode }}
        run: node galerie.js ${{ matrix.mode }} --vitrine=ici --emails=ici
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balayages-${{ strategy.job-index }}
          path: |
            outils/galerie/sortie/*.txt
            outils/galerie/sortie/galerie.html
            outils/galerie/sortie/courriels.html
          if-no-files-found: ignore

  # Parcours de commande après « Payer » (faux serveur, fausse page Stripe) : double appui, retour arrière,
  # renvois du serveur, retour sur la page après avoir payé. Les tests « todo » décrivent ce qui reste à corriger
  # (audit du 11/11) : ils n'arrêtent pas la fusion.
  # Deux fois : Chromium (Chrome, Android) et WebKit (moteur de Safari, iPhone), Tanguy 17/11.
  commande-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # 15 + le 1er remplissage du cache Playwright (apt jusqu’à 20 min, 18/11)
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit]
    defaults:
      run:
        working-directory: outils/galerie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Navigateur ${{ matrix.navigateur }} de Playwright en cache (navigateurs et paquets système .deb) : l'installation complète
      # prenait jusqu'à 21 min (paquets apt à 110 ko/s, 18/11) et faisait couper la tâche. Cache trouvé : seulement
      # les dépendances système (install-deps), avec les .deb déjà là. Version de Playwright + navigateur + image.
      - name: Version de Playwright (${{ matrix.navigateur }})
        id: pw
        run: echo "cle=playwright-$(node -p "require('playwright/package.json').version")-${{ matrix.navigateur }}-$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: pw-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pw.outputs.cle }}
      - name: Installer ${{ matrix.navigateur }} (Playwright)
        run: |
          if [ -d ~/.cache/apt-playwright ]; then sudo cp ~/.cache/apt-playwright/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps ${{ matrix.navigateur }}; else npx playwright install --with-deps ${{ matrix.navigateur }}; fi
          mkdir -p ~/.cache/apt-playwright && cp /var/cache/apt/archives/*.deb ~/.cache/apt-playwright/ 2>/dev/null || true
      # Gardé dès l'installation finie, même si les tests échouent ensuite (le cache d'un job rouge n'était pas gardé).
      - uses: actions/cache/save@v4
        if: steps.pw-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pw.outputs.cle }}
      - name: Parcours de commande sur téléphone (${{ matrix.navigateur }})
        run: node --test commande-site.test.js
        env:
          NAVIGATEUR: ${{ matrix.navigateur }}

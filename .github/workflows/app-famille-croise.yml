# L'app famille (branche claude/project-thread-dlattc) est testée contre les fonctions de main.
# Un changement de main peut donc la casser sans toucher web/ : c'est arrivé le 5/11 (famille préparée).
# Ici, à chaque changement des fonctions sur main, les tests de bout en bout de l'app famille repartent,
# avec l'app de dlattc et les fonctions de ce commit (Tanguy, 6/11). Gratuit (dépôt public).
# Aussi sur les branches de lot (claude/lot-*, fusionnées dans main ensuite, Tanguy 18/11) : le commit arrive sur
# main déjà vérifié, et le bouton « Publier » (outils/publier/ci-verte.sh, qui cherche par commit) n'a rien à attendre.
# App testée sur un lot : le lot de l'admin qui va avec s'il existe (claude/lot-X-main ou claude/lot-X →
# claude/lot-X-admin, fusionnés ensemble), sinon dlattc. À la main (Run workflow) : champ « admin ».
name: App famille avec ces fonctions

on:
  push:
    branches: [main, 'claude/lot-*']
    paths: ['functions/**', '.github/workflows/app-famille-croise.yml']
  workflow_dispatch:
    inputs:
      admin:
        description: Branche de l'app famille à tester (vide = claude/project-thread-dlattc)
        type: string
        default: ''

# Comme les autres vérifications : un nouveau push sur un lot annule l'exécution en cours du commit précédent ;
# jamais sur main, où chaque commit garde la sienne pour le bouton « Publier ».
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Tests à l'heure de Paris, comme l'app montrée en France : « aujourd'hui », minuit, jour du mois… (Tanguy, 18/11).
# Les machines de GitHub sont en UTC : sans ça, entre 23 h et minuit (22 h l'été) la date des tests n'était pas celle de Paris.
env:
  TZ: Europe/Paris

jobs:
  # Quelle app famille tester (le commit exact, le même pour toutes les tâches), avec quelle image de Playwright (la
  # version du package.json de cette app), et en combien de morceaux (tests/app-famille/morceaux.js de cette app).
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.app.outputs.sha }}
      playwright: ${{ steps.app.outputs.playwright }}
      morceaux: ${{ steps.app.outputs.morceaux }}
    steps:
      - name: Branche de l'app famille
        id: admin
        env:
          GH_TOKEN: ${{ github.token }}
          DEMANDE: ${{ inputs.admin }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          admin=claude/project-thread-dlattc
          if [ -n "$DEMANDE" ]; then
            admin="$DEMANDE"
          elif [[ "$BRANCHE" == claude/lot-* ]]; then
            lot="${BRANCHE%-main}-admin"
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${lot}" --silent 2>/dev/null; then admin="$lot"; fi
          fi
          echo "App famille testée : $admin (fonctions : $BRANCHE ${GITHUB_SHA:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref=$admin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.admin.outputs.ref }}
          sparse-checkout: tests/app-famille
      - name: Commit, version de Playwright, morceaux
        id: app
        working-directory: tests/app-famille
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
          # Chaque scénario dans exactement un morceau (sinon rouge ici, avant tout). Une app sans morceaux.js
          # (branche d'avant le 19/11) : toute la suite d'un bloc (« morceau » 0 = npm test).
          if [ -f morceaux.js ]; then
            node morceaux.js verifier
            echo "morceaux=$(node -p "JSON.stringify(Array.from({ length: Number(process.argv[1]) }, (_, i) => i + 1))" "$(node morceaux.js nombre)")" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pas de tests/app-famille/morceaux.js sur cette branche : tous les scénarios dans une seule tâche."
            echo 'morceaux=[0]' >> "$GITHUB_OUTPUT"
          fi

  # Tous les scénarios de l'app famille (Chromium), coupés en morceaux parallèles, chacun avec ses propres émulateurs :
  # chaque scénario tourne exactement une fois. D'un bloc, ~30 min (run 44504191860) ; en 3 morceaux, ~10 min.
  app-famille:
    needs: preparation
    name: app-famille (chromium, morceau ${{ matrix.morceau }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        morceau: ${{ fromJSON(needs.preparation.outputs.morceaux) }}
    runs-on: ubuntu-24.04
    # ~10 à 12 min attendues par morceau : le double (une app sans morceaux.js, d'un bloc : ~30 min, coupée).
    timeout-minutes: ${{ needs.preparation.outputs.morceaux == '[0]' && 45 || 25 }}
    # Image officielle de Playwright, même version que le package.json de l'app testée : navigateurs et paquets
    # système déjà dedans, plus d'apt pendant le run (3 à 4 min, jusqu'à 20 les mauvais jours).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.preparation.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - name: App famille (${{ needs.preparation.outputs.sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparation.outputs.sha }}
          fetch-depth: 0
      - name: Fonctions de ce commit
        uses: actions/checkout@v4
        with:
          path: .main
      # Conteneur : le dossier appartient au runner, git le refuserait sans ceci.
      - run: git config --global --add safe.directory '*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/app-famille/package-lock.json
            .main/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-14
      - run: npm ci --no-audit --no-fund
        working-directory: .main/functions
      - run: npm ci
        working-directory: tests/app-famille
      # Déjà dans l'image (rien n'est téléchargé) ; ne servirait que si la version du package changeait sans l'image.
      - run: npx playwright install chromium
        working-directory: tests/app-famille
      - name: Scénarios du morceau ${{ matrix.morceau }}
        working-directory: tests/app-famille
        env:
          MORCEAU: ${{ matrix.morceau }}
        # $GITHUB_WORKSPACE et pas ${{ github.workspace }} : dans le conteneur, le dossier n'est pas au même endroit.
        run: |
          export PAPOTE_FONCTIONS="$GITHUB_WORKSPACE/.main/functions"
          if [ "$MORCEAU" = 0 ]; then npm test; else node morceaux.js lancer "$MORCEAU"; fi
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-app-famille-${{ matrix.morceau }}
          path: tests/app-famille/captures/
          if-no-files-found: ignore

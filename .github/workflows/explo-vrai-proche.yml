# Essai ponctuel du testeur « vrai proche » (17/11) sous WebKit (Safari d'iPhone) : parcours joués, captures
# remises sur cette branche. Ne fait jamais échouer la CI (pas de mail « run failed »).
name: Explo vrai proche (iPhone)
on:
  push:
    branches: ['claude/project-thread-rts5iy']
    paths: ['tests/explo-vrai-proche/**', '.github/workflows/explo-vrai-proche.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PAPOTE_MOTEUR: webkit
      PAPOTE_APPAREIL: iPhone 15
      SORTIE: ${{ github.workspace }}/tests/explo-vrai-proche/sortie/captures
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: tests/app-famille
      - run: npx playwright install --with-deps webkit
        working-directory: tests/app-famille
      - run: node preparer.js
        working-directory: tests/app-famille
      - name: Parcours
        continue-on-error: true
        working-directory: tests/app-famille
        run: |
          mkdir -p "$SORTIE"
          timeout 4200 npx --yes firebase-tools@14 emulators:exec --only firestore,auth,storage --project demo-papote --config firebase.json "node --test --test-concurrency=1 --test-timeout=2300000 ../explo-vrai-proche/a-responsable.test.js ../explo-vrai-proche/b-famille.test.js" > "$SORTIE/../sortie.log" 2>&1 || true
      - name: Captures remises sur la branche
        if: always()
        run: |
          git config user.name "papote-explo"
          git config user.email "explo@users.noreply.github.com"
          git add -f tests/explo-vrai-proche/sortie
          git commit -m "Captures iPhone du testeur vrai proche" || exit 0
          git push origin HEAD:${{ github.ref_name }} || true

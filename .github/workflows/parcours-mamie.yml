# Le parcours de Mamie de bout en bout, les trois branches ensemble : la vraie app famille (cette branche), les
# vraies fonctions (main) et la vraie tablette (sa branche : son code Java compilé sur l'ordinateur et ses écrans),
# sur les émulateurs Firebase. Gratuit, rien en ligne. Mode d'emploi : tests/parcours-mamie/README.md.
name: Parcours de Mamie

# Au push sur cette branche (app, règles, essais). Un changement sur main ou sur la branche de la tablette ne
# le lance pas tout seul : bouton « Run workflow » avant une publication ou une mise à jour des tablettes.
on:
  push:
    paths: ['web/**', 'firestore.rules', 'storage-eu.rules', 'tests/parcours-mamie/**', 'tests/app-famille/banc.js', 'tests/app-famille/gestes.js', '.github/workflows/parcours-mamie.yml']
  workflow_dispatch:

# Un nouveau push sur la même branche de travail annule l'exécution encore en cours du commit précédent (CI plus
# rapide, moins d'attente). Jamais sur main ni sur l'admin (claude/project-thread-dlattc) : le bouton « Publier »
# (outils/publier/ci-verte.sh) y exige une CI verte sur le commit publié, chaque commit y garde donc la sienne.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-dlattc') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/project-thread-dlattc' }}

jobs:
  parcours-mamie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tests/parcours-mamie
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/app-famille/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: tests/parcours-mamie/tablette-jvm/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-14
      - run: npm ci
        working-directory: tests/app-famille
      # Navigateur chromium de Playwright en cache (navigateurs et paquets système .deb) : l'installation complète
      # prenait jusqu'à 21 min (paquets apt à 110 ko/s, 18/11) et faisait couper la tâche. Cache trouvé : seulement
      # les dépendances système (install-deps), avec les .deb déjà là. Version de Playwright + navigateur + image.
      - name: Version de Playwright (chromium)
        id: pw
        working-directory: tests/app-famille
        run: echo "cle=playwright-$(node -p "require('playwright/package.json').version")-chromium-$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-playwright
          key: ${{ steps.pw.outputs.cle }}
      - name: Installer chromium (Playwright)
        working-directory: tests/app-famille
        run: |
          if [ -d ~/.cache/apt-playwright ]; then sudo cp ~/.cache/apt-playwright/*.deb /var/cache/apt/archives/ 2>/dev/null || true; fi
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
          mkdir -p ~/.cache/apt-playwright && cp /var/cache/apt/archives/*.deb ~/.cache/apt-playwright/ 2>/dev/null || true
      - run: npm test
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-parcours-mamie
          path: tests/app-famille/captures/
          if-no-files-found: ignore

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Papote</title>
  <link rel="stylesheet" href="tablette.css">
</head>
<body>
  <!-- Accueil : l'heure, la date, les personnes à appeler, et la photo à droite -->
  <section id="view-home" class="view home">
    <div class="home-left">
      <div class="home-time">
        <p id="clock" class="clock">--:--</p>
        <p id="date" class="date"></p>
        <div id="weather" class="weather" hidden>
          <span id="weather-icon" class="weather-icon"></span>
          <span id="weather-temp" class="weather-temp"></span>
          <span id="weather-label" class="weather-label"></span>
        </div>
      </div>
      <p id="offline" class="offline" hidden>Pas de connexion internet pour le moment</p>
    </div>
    <div id="home-frame" class="home-frame">
      <img id="frame-img" alt="" hidden>
      <span id="frame-caption" class="frame-caption" hidden></span>
      <span id="frame-empty" class="frame-empty">Les photos de la famille s'afficheront ici</span>
    </div>
  </section>

  <!-- Photos -->
  <section id="view-photos" class="view dark" hidden>
    <div id="photo-stage" class="photo-stage">
      <img id="photo-img" alt="">
      <button id="photo-prev" class="arrow left">&#8249;</button>
      <button id="photo-next" class="arrow right">&#8250;</button>
      <p id="photo-caption" class="photo-caption"></p>
    </div>
    <div class="bottom-bar">
      <button id="photo-heart" class="big-btn heart"><span class="label">Envoyer un bisou</span></button>
      <button class="big-btn home-btn" data-home="1">Accueil</button>
    </div>
  </section>

  <!-- Écran d'un nouvel envoi (photo, message, vocal, vidéo), dans l'esprit de Linote :
       un mot sur papier posé sur du bois, la photo à droite, l'heure en bas. -->
  <div id="overlay" class="overlay ln" hidden>
    <div class="ln-main">
      <div class="ln-wood">
        <div class="ln-note">
          <p id="overlay-text" class="ln-text"></p>
          <p id="overlay-from" class="ln-sign"></p>
          <button id="overlay-play" class="ln-play" hidden><span class="label">Écouter</span></button>
        </div>
      </div>
      <div id="ln-media" class="ln-media" hidden>
        <img id="overlay-img" alt="">
      </div>
    </div>
    <div class="ln-bar">
      <p class="ln-clock"></p>
      <div id="overlay-actions" class="ln-actions">
        <button id="overlay-replay" class="ln-btn replay" hidden><span class="label">Réécouter</span></button>
        <button id="overlay-heart" class="ln-btn heart"><span class="label">Envoyer un bisou</span></button>
        <button id="overlay-close" class="ln-btn ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Rappel : un peu avant, puis à l'heure -->
  <div id="reminder-alert" class="overlay ln reminder" hidden>
    <div class="ln-main">
      <div class="ln-wood">
        <div class="ln-note">
          <p id="reminder-when" class="ln-when"></p>
          <p id="reminder-icon" class="reminder-icon"></p>
          <p id="reminder-title" class="ln-text size-m"></p>
          <p id="reminder-time" class="ln-sign"></p>
        </div>
      </div>
    </div>
    <div class="ln-bar">
      <p class="ln-clock"></p>
      <div class="ln-actions">
        <button id="reminder-done" class="ln-btn ok">C'est fait</button>
      </div>
    </div>
  </div>

  <!-- Appel entrant -->
  <div id="call-ring" class="overlay ln call-ring" hidden>
    <div class="ln-main">
      <div class="ln-wood">
        <div class="ln-note">
          <p id="ring-name" class="ln-text size-l"></p>
        </div>
      </div>
    </div>
    <div class="ln-bar">
      <p class="ln-clock"></p>
      <div class="ln-actions">
        <button id="ring-decline" class="ln-btn decline">Refuser</button>
        <button id="ring-answer" class="ln-btn answer">Décrocher</button>
      </div>
    </div>
  </div>

  <!-- Appel en cours (entrant ou sortant) -->
  <div id="call-view" class="call-view" hidden>
    <video id="call-remote" autoplay playsinline></video>
    <video id="call-local" autoplay playsinline muted></video>
    <p id="call-status" class="call-status" hidden></p>
    <button id="call-hangup" class="call-hangup">Raccrocher</button>
  </div>

  <!-- Tablette pas encore reliée à une famille -->
  <section id="view-setup" class="view setup" hidden>
    <p class="clock" id="setup-clock"></p>
    <p class="setup-text">Cette tablette n'est pas encore reliée à une famille.</p>
    <p id="setup-detail" class="setup-detail"></p>
  </section>

  <audio id="player"></audio>
  <script src="tablette.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Papote</title>
  <link rel="stylesheet" href="tablette.css">
</head>
<body>
  <!-- Accueil -->
  <section id="view-home" class="view">
    <div class="home-grid">
      <div class="home-left">
        <p id="greeting" class="greeting"></p>
        <p id="clock" class="clock">--:--</p>
        <p id="date" class="date"></p>
        <p id="next-reminder" class="next-reminder" hidden></p>
        <div id="weather" class="weather" hidden>
          <div class="weather-now">
            <span id="weather-icon" class="weather-icon"></span>
            <span id="weather-temp" class="weather-temp"></span>
          </div>
          <p id="weather-label" class="weather-label"></p>
          <p id="weather-minmax" class="weather-minmax"></p>
          <p id="weather-tomorrow" class="weather-tomorrow"></p>
        </div>
      </div>
      <div id="home-frame" class="home-frame">
        <img id="frame-img" alt="" hidden>
        <span id="frame-caption" class="frame-caption" hidden></span>
        <span id="frame-empty" class="frame-empty">Les photos de la famille s'afficheront ici</span>
      </div>
    </div>
    <div class="home-buttons">
      <button id="btn-photos" class="big-btn">
        <span class="icon" data-icon="camera"></span> Photos <span id="badge-photos" class="badge" hidden></span>
      </button>
      <button id="btn-messages" class="big-btn">
        <span class="icon" data-icon="letter"></span> Messages <span id="badge-messages" class="badge" hidden></span>
      </button>
      <button id="btn-agenda" class="big-btn">
        <span class="icon" data-icon="calendar"></span> Agenda
      </button>
    </div>
    <p id="offline" class="offline" hidden>Pas de connexion internet pour le moment</p>
  </section>

  <!-- Photos -->
  <section id="view-photos" class="view" hidden>
    <div id="photo-stage" class="photo-stage">
      <img id="photo-img" alt="">
      <button id="photo-prev" class="arrow left">&#8249;</button>
      <button id="photo-next" class="arrow right">&#8250;</button>
    </div>
    <div class="photo-bar">
      <p id="photo-caption" class="photo-caption"></p>
      <button id="photo-heart" class="heart-btn"><span class="icon" data-icon="heart"></span> <span class="label">Bisou</span></button>
    </div>
    <button class="home-btn" data-home="1">Accueil</button>
  </section>

  <!-- Messages -->
  <section id="view-messages" class="view" hidden>
    <h1 class="view-title">Messages</h1>
    <div id="message-list" class="message-list"></div>
    <p id="message-empty" class="empty" hidden>Pas encore de message.</p>
    <button class="home-btn" data-home="1">Accueil</button>
  </section>

  <!-- Agenda -->
  <section id="view-agenda" class="view" hidden>
    <h1 class="view-title">Agenda</h1>
    <div id="agenda-list" class="message-list"></div>
    <p id="agenda-empty" class="empty" hidden>Rien de prévu.</p>
    <button class="home-btn" data-home="1">Accueil</button>
  </section>

  <!-- Rappel à l'heure -->
  <div id="reminder-alert" class="overlay reminder-overlay" hidden>
    <div class="overlay-card">
      <p class="overlay-title">C'est l'heure !</p>
      <p id="reminder-icon" class="reminder-icon"></p>
      <p id="reminder-title" class="reminder-big"></p>
      <p id="reminder-time" class="reminder-time"></p>
      <div class="overlay-actions">
        <button id="reminder-done" class="big-btn done">C'est fait</button>
      </div>
    </div>
  </div>

  <!-- Nouveau message ou nouvelle photo -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <p id="overlay-title" class="overlay-title"></p>
      <img id="overlay-img" alt="" hidden>
      <p id="overlay-text" class="overlay-text" hidden></p>
      <button id="overlay-play" class="big-btn play" hidden><span class="icon" data-icon="play"></span> <span class="label">Écouter</span></button>
      <div class="overlay-actions">
        <button id="overlay-heart" class="big-btn heart"><span class="icon" data-icon="heart"></span> <span class="label">Bisou</span></button>
        <button id="overlay-reply" class="big-btn reply">Répondre</button>
        <button id="overlay-close" class="big-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- Réponses toutes faites -->
  <div id="reply-panel" class="overlay reply-overlay" hidden>
    <div class="overlay-card">
      <p class="overlay-title">Que voulez-vous répondre ?</p>
      <div class="reply-grid">
        <button class="big-btn reply-choice" data-reply="Merci, ça me fait plaisir ! ❤️">Merci, ça me fait plaisir !</button>
        <button class="big-btn reply-choice" data-reply="Je vais bien 😊">Je vais bien</button>
        <button class="big-btn reply-choice" data-reply="Appelle-moi quand tu peux 📞">Appelle-moi</button>
        <button class="big-btn reply-choice" data-reply="Je pense à toi, bisous 😘">Je pense à toi</button>
      </div>
      <button id="reply-cancel" class="home-btn">Annuler</button>
    </div>
  </div>
  <p id="reply-sent" class="toast" hidden>Réponse envoyée ✓</p>
  <audio id="player"></audio>

  <!-- Tablette pas encore reliée à une famille -->
  <section id="view-setup" class="view setup" hidden>
    <p class="clock" id="setup-clock"></p>
    <p class="setup-text">Cette tablette n'est pas encore reliée à une famille.</p>
    <p id="setup-detail" class="setup-detail"></p>
  </section>

  <!-- Appel entrant -->
  <div id="call-ring" class="call-ring" hidden>
    <p id="ring-name" class="ring-name"></p>
    <div class="ring-actions">
      <button id="ring-decline" class="ring-btn decline">Refuser</button>
      <button id="ring-answer" class="ring-btn answer">Décrocher</button>
    </div>
  </div>

  <!-- Appel en cours -->
  <div id="call-view" class="call-view" hidden>
    <video id="call-remote" autoplay playsinline></video>
    <video id="call-local" autoplay playsinline muted></video>
    <p id="call-status" class="call-status" hidden></p>
    <button id="call-hangup" class="call-hangup">Raccrocher</button>
  </div>

  <script src="tablette.js"></script>
</body>
</html>

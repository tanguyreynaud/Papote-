<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Papote</title>
  <link rel="stylesheet" href="tablette.css">
  <link rel="stylesheet" href="bienvenue.css">
</head>
<body>
  <!-- Chargement au démarrage, jusqu'aux premières nouvelles d'Android (Bienvenue ou accueil) -->
  <div id="boot" class="boot">
    <img class="boot-logo" src="logo.svg" alt="">
    <p class="boot-name">Papote</p>
    <span class="boot-spin"></span>
    <p class="boot-note" id="boot-note" aria-live="polite"></p>
  </div>
  <!-- Accueil : l'heure, la date, les personnes à appeler, et la photo à droite -->
  <section id="view-home" class="view home">
    <div class="home-left">
      <div class="home-time">
        <p id="clock" class="clock">--:--</p>
        <p id="date" class="date"></p>
        <div id="weather" class="weather" hidden>
          <span id="weather-icon" class="weather-icon"></span>
          <span id="weather-temp" class="weather-temp"></span>
          <span id="weather-label" class="weather-label"></span>
        </div>
      </div>
    </div>
    <div id="home-frame" class="home-frame">
      <img id="frame-img" alt="" hidden>
      <span id="frame-caption" class="frame-caption" hidden></span>
      <span id="frame-empty" class="frame-empty">Les photos de la famille s'afficheront ici</span>
    </div>
  </section>

  <!-- Photos -->
  <section id="view-photos" class="view photos" hidden>
    <div id="photo-stage" class="photo-stage">
      <div id="slide-a" class="slide"><div class="photo-bg"></div><img alt=""></div>
      <div id="slide-b" class="slide"><div class="photo-bg"></div><img alt=""></div>
      <div class="night-veil"></div>
      <button id="photo-prev" class="arrow left" aria-label="Photo précédente"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <button id="photo-next" class="arrow right" aria-label="Photo suivante"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    </div>
    <div class="photo-bar">
      <button class="ln-btn photo-home" data-home="1"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg><span>Accueil</span></button>
      <div class="photo-caption"><p id="photo-who" class="photo-who"></p><p id="photo-text" class="photo-text"></p></div>
    </div>
  </section>

  <!-- Écran d'un nouvel envoi (photo, message, vocal, vidéo), dans l'esprit de Linote :
       un mot sur papier posé sur du bois, la photo à droite, l'heure en bas. -->
  <div id="overlay" class="overlay ln" hidden>
    <div class="ln-main">
      <div class="ln-wood">
        <div class="ln-note">
          <p id="overlay-text" class="ln-text"></p>
          <p id="overlay-from" class="ln-sign"></p>
        </div>
        <div id="ln-playzone" class="ln-playzone" hidden>
          <button id="overlay-play" class="ln-play"><span class="label">Écouter</span></button>
        </div>
      </div>
      <div id="ln-media" class="ln-media" hidden>
        <div id="overlay-img-bg" class="ln-media-bg"></div>
        <img id="overlay-img" alt="">
        <button id="overlay-media-play" class="media-play" hidden aria-label="Voir la vidéo"></button>
      </div>
    </div>
    <div class="ln-bar">
      <p id="overlay-clock" class="overlay-clock"></p>
      <div id="overlay-actions" class="ln-actions">
        <button id="overlay-replay" class="ln-btn replay" hidden aria-label="Revoir"><span class="label">Réécouter</span></button>
        <button id="overlay-close" class="ln-btn ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Rappel : un peu avant, puis à l'heure -->
  <div id="reminder-alert" class="overlay ln reminder" hidden>
    <div class="ln-main">
      <div class="ln-wood">
        <div class="ln-note">
          <p id="reminder-when" class="ln-when"></p>
          <p id="reminder-icon" class="reminder-icon"></p>
          <p id="reminder-title" class="ln-text size-m"></p>
          <p id="reminder-time" class="ln-sign"></p>
        </div>
      </div>
    </div>
    <div class="ln-bar">
      <div class="ln-actions">
        <button id="reminder-done" class="ln-btn ok">C'est fait</button>
      </div>
    </div>
  </div>

  <!-- Appel entrant : qui appelle, en grand à gauche ; Mamie et « Décrocher » à droite -->
  <div id="call-ring" class="call-screen call-ring" hidden>
    <div class="call-side">
      <img id="ring-caller" class="caller-face" alt="" hidden>
      <p id="ring-name" class="call-title"></p>
      <p class="call-sub">vous appelle</p>
    </div>
    <div class="call-side me">
      <video id="ring-face" class="ring-face" autoplay playsinline muted hidden></video>
      <p id="ring-hint" class="call-hint" hidden>Regardez l'écran pour décrocher</p>
      <button id="ring-answer" class="call-btn answer"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg><span>Décrocher</span></button>
    </div>
  </div>

  <!-- Appel en cours : c'est la famille qui raccroche -->
  <div id="call-view" class="call-view" hidden>
    <video id="call-remote" autoplay playsinline></video>
    <video id="call-local" autoplay playsinline muted></video>
    <div id="call-wait" class="call-screen call-wait">
      <div class="call-side">
        <img id="call-wait-face" class="caller-face" alt="" hidden>
        <p id="call-wait-name" class="call-title"></p>
        <p id="call-status" class="call-sub"></p>
      </div>
    </div>
    <!-- Appel lancé par Mamie et passé en vidéo par le proche : elle peut raccrocher -->
    <button id="call-out-hangup" class="call-btn decline call-out-hangup" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg><span>Raccrocher</span></button>
  </div>

  <!-- Tablette pas encore reliée à une famille -->
  <section id="view-setup" class="view setup" hidden>
    <p class="clock" id="setup-clock"></p>
    <p class="setup-text">Cette tablette n'est pas encore reliée à une famille.</p>
    <p id="setup-detail" class="setup-detail"></p>
  </section>

  <audio id="player"></audio>
  <script src="bienvenue.js"></script>
  <script src="tablette.js"></script>
</body>
</html>
